<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024">
  <title>Publish Event | CEM</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      min-height: 100vh;
      padding: 40px 0;
      overflow-y: auto;
      background: #F8FAFC;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: #1F2937;
    }

    .publish-container {
      width: 460px;
      margin: auto;
      background: #ffffff;
      border-radius: 22px;
      padding: 35px;
      border: 1.5px solid #e2e8f0;
      box-shadow: 0 8px 32px rgba(15,76,129,0.1);
      animation: slideUp 1s ease forwards;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #0F4C81;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 13px;
      margin-bottom: 4px;
      color: #6B7280;
      font-weight: 600;
    }

    input, textarea, select {
      width: 100%;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1.5px solid #e2e8f0;
      background: #F8FAFC;
      color: #1F2937;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #1E88E5;
      box-shadow: 0 0 0 3px rgba(30,136,229,0.12);
    }

    textarea {
      resize: none;
      height: 80px;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      background: linear-gradient(135deg, #FFC107, #FFA000);
      color: #1F2937;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 14px rgba(255,193,7,0.3);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255,193,7,0.4);
    }

    .login-btn.secondary {
      background: #F8FAFC;
      color: #0F4C81;
      border: 1.5px solid #e2e8f0;
      box-shadow: none;
    }

    .login-btn.secondary:hover {
      background: #e2e8f0;
      box-shadow: none;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(35px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* FIXED 1024px DESKTOP LAYOUT ENFORCEMENT */
    html, body {
      width: 100%;
      min-width: 1024px;
      overflow-x: auto;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>

<div class="publish-container">

  <h2>📅 Publish New Event</h2>

  <div class="form-group">
    <label>Event Title</label>
    <input type="text" id="title">
  </div>

  <div class="form-group">
    <label>Event Description</label>
    <textarea id="description"></textarea>
  </div>

  <div class="form-group">
    <label>Event Venue</label>
    <input type="text" id="venue">
  </div>

  <div class="two-column">
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="date">
    </div>

    <div class="form-group">
      <label>Time</label>
      <input type="time" id="time">
    </div>
  </div>

  <div class="form-group">
    <label>Registration Deadline <span style="color: #ef4444;">*</span></label>
    <input type="datetime-local" id="registrationDeadline" required>
    <small style="font-size: 11px; opacity: 0.7; margin-top: 4px; display: block;">
      Events will automatically disappear from student view after this deadline
    </small>
  </div>

  <!-- Faculty Coordinator Section with Plus Icon -->
  <div class="form-group">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <label style="margin-bottom:0;">Faculty Coordinator(s)</label>
      <button type="button" onclick="addFacultyCoord_PublishPage()" style="background:rgba(30,136,229,0.1);color:#1E88E5;border:1px solid rgba(30,136,229,0.3);padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;">
        ➕ Add Faculty
      </button>
    </div>
    <div id="facultyCoordsContainer">
      <div class="two-column faculty-coord-item" style="margin-bottom:8px;">
        <div class="form-group" style="margin-bottom:0;">
          <input type="text" class="pub-faculty-name" id="faculty" placeholder="Faculty name">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <input type="tel" class="pub-faculty-phone" id="facultyPhone" placeholder="Phone number">
        </div>
      </div>
    </div>
  </div>

  <!-- Student Coordinator Section with Plus Icon -->
  <div class="form-group">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <label style="margin-bottom:0;">Student Coordinator(s)</label>
      <button type="button" onclick="addStudentCoord_PublishPage()" style="background:rgba(30,136,229,0.1);color:#1E88E5;border:1px solid rgba(30,136,229,0.3);padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;">
        ➕ Add Student
      </button>
    </div>
    <div id="studentCoordsContainer">
      <div class="two-column student-coord-item" style="margin-bottom:8px;">
        <div class="form-group" style="margin-bottom:0;">
          <input type="text" class="pub-student-name" id="student" placeholder="Student name">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <input type="tel" class="pub-student-phone" id="studentPhone" placeholder="Phone number">
        </div>
      </div>
    </div>
  </div>

  <button class="login-btn" onclick="publishEvent()">
    🚀 Publish Event
  </button>

  <button class="login-btn secondary" onclick="location.href='facultyDashboard.html'" style="margin-top: 10px;">
    ⬅ Back to Dashboard
  </button>

</div>

<script>
function addFacultyCoord_PublishPage(name = '', phone = '') {
  const container = document.getElementById('facultyCoordsContainer');
  const div = document.createElement('div');
  div.className = 'faculty-coord-item';
  div.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;margin-bottom:8px;align-items:center;';
  div.innerHTML = `
    <input type="text" class="pub-faculty-name" placeholder="Faculty name" value="${name}">
    <input type="tel" class="pub-faculty-phone" placeholder="Phone number" value="${phone}">
    <button type="button" onclick="this.parentElement.remove()" style="background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.3);width:34px;height:40px;border-radius:8px;cursor:pointer;font-weight:bold;" title="Remove">✕</button>
  `;
  container.appendChild(div);
}

function addStudentCoord_PublishPage(name = '', phone = '') {
  const container = document.getElementById('studentCoordsContainer');
  const div = document.createElement('div');
  div.className = 'student-coord-item';
  div.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;margin-bottom:8px;align-items:center;';
  div.innerHTML = `
    <input type="text" class="pub-student-name" placeholder="Student name" value="${name}">
    <input type="tel" class="pub-student-phone" placeholder="Phone number" value="${phone}">
    <button type="button" onclick="this.parentElement.remove()" style="background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.3);width:34px;height:40px;border-radius:8px;cursor:pointer;font-weight:bold;" title="Remove">✕</button>
  `;
  container.appendChild(div);
}

async function publishEvent() {
  const facultyNameEls = document.querySelectorAll('.pub-faculty-name');
  const facultyPhoneEls = document.querySelectorAll('.pub-faculty-phone');
  const facultyNames = [];
  const facultyPhones = [];
  facultyNameEls.forEach((el, idx) => {
    const n = el.value.trim();
    const p = facultyPhoneEls[idx] ? facultyPhoneEls[idx].value.trim() : '';
    if (n) {
      facultyNames.push(n);
      if (p) facultyPhones.push(p);
    }
  });

  const studentNameEls = document.querySelectorAll('.pub-student-name');
  const studentPhoneEls = document.querySelectorAll('.pub-student-phone');
  const studentNames = [];
  const studentPhones = [];
  studentNameEls.forEach((el, idx) => {
    const n = el.value.trim();
    const p = studentPhoneEls[idx] ? studentPhoneEls[idx].value.trim() : '';
    if (n) {
      studentNames.push(n);
      if (p) studentPhones.push(p);
    }
  });

  const eventData = {
    title: title.value,
    description: description.value,
    venue: venue.value,
    date: date.value,
    time: time.value,
    faculty: facultyNames.join(', '),
    facultyPhone: facultyPhones.join(', '),
    student: studentNames.join(', '),
    studentPhone: studentPhones.join(', '),
    registrationDeadline: registrationDeadline.value
  };

  if (!eventData.title || !eventData.date || !eventData.time) {
    alert("⚠️ Please fill required fields (Title, Date, Time)");
    return;
  }

  if (!eventData.registrationDeadline) {
    alert("⚠️ Please set a registration deadline");
    return;
  }

  try {
    const response = await fetch("/api/events", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(eventData)
    });

    const result = await response.json();

    if (response.ok) {
      alert("✅ " + result.message);
      
      // Clear form
      document.querySelectorAll("input, textarea").forEach(e => e.value = "");
      
      // Redirect to dashboard after 1 second
      setTimeout(() => {
        window.location.href = "facultyDashboard.html";
      }, 1000);
    } else {
      alert("❌ " + result.message);
    }

  } catch (error) {
    alert("❌ Server error. Check backend.");
    console.error(error);
  }
}
</script>

</body>
</html>
